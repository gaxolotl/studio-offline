name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package server zip
        run: |
          New-Item -ItemType Directory -Force -Path "package"
          Copy-Item "target/release/studio_offline_server.exe" "package/"
          Copy-Item -Recurse "static" "package/static"
          Compress-Archive -Path "package/*" -DestinationPath "studio-offline-server.zip"
      - name: Build offsets scanner (Windows)
        run: cargo build --release -p offsets_scanner
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studio-offline-build-${{ github.sha }}
          path: |
            target/release/studio_offline.dll
            target/release/webview_who.dll
            target/release/studio_offline_server.exe
            target/release/offsets_scanner.exe
            server/*.exe
            studio-offline-server.zip
          if-no-files-found: error
